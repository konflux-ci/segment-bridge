---
extends: default
rules:
  braces:
    max-spaces-inside: -1
  # Full 40-char action SHAs (org policy) routinely exceed 80 cols.
  line-length:
    max: 120
ignore:
  - .tekton/
  - .github/workflows/fullsend.yaml
  - tekton-to-segment/sample/
  - get-konflux-public-info/sample/
  - fetch-konflux-op-records/sample/
  - fetch-namespace-records/testdata/
  - fetch-component-records/testdata/
  - fetch-application-records/testdata/
