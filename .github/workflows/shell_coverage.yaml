---
name: Shell script coverage
"on":
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
jobs:
  shell-coverage:
    runs-on: ubuntu-latest
    env:
      KCOV_OUTPUT_DIR: "${{ github.workspace }}/kcov-output"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install Podman and kcov build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y podman \
            cmake g++ binutils-dev libdw-dev \
            libcurl4-openssl-dev zlib1g-dev
      - name: Build and install kcov
        run: |
          git clone --depth 1 \
            https://github.com/SimonKagstrom/kcov.git /tmp/kcov-src
          cmake -S /tmp/kcov-src -B /tmp/kcov-build
          cmake --build /tmp/kcov-build -j"$(nproc)"
          sudo cmake --install /tmp/kcov-build
          kcov --version
      - name: Run Go tests with kcov shell instrumentation
        run: |
          mkdir -p "$KCOV_OUTPUT_DIR"

          go test -p 1 -v ./... &
          test_pid=$!
          (
            timer_pid=
            # This callback is invoked indirectly by trap; ShellCheck cannot see it.
            # shellcheck disable=SC2329
            stop_watchdog() {
              if [[ -n "${timer_pid:-}" ]]; then
                kill "$timer_pid" 2>/dev/null || true
                wait "$timer_pid" 2>/dev/null || true
              fi
              exit 0
            }
            trap stop_watchdog INT TERM
            sleep 360 &
            timer_pid=$!
            wait "$timer_pid" || exit 0
            if kill -0 "$test_pid" 2>/dev/null; then
              echo "::group::Process tree after 6 minutes of shell coverage tests"
              ps -eo pid,ppid,pgid,stat,etime,wchan:32,args --forest
              echo "::endgroup::"
            fi
          ) &
          watchdog_pid=$!

          if wait "$test_pid"; then
            test_status=0
          else
            test_status=$?
          fi

          kill -TERM "$watchdog_pid" 2>/dev/null || true
          wait "$watchdog_pid" 2>/dev/null || true
          exit "$test_status"
      - name: Print per-file shell coverage summary
        if: always()
        run: |
          XML="$KCOV_OUTPUT_DIR/kcov-merged/cobertura.xml"
          if [[ ! -f "$XML" ]]; then
            echo "::error::No cobertura.xml found at $XML"
            exit 1
          fi
          echo "## Shell script coverage (kcov)"
          python3 -c "
          import xml.etree.ElementTree as ET, sys
          tree = ET.parse('$XML')
          root = tree.getroot()
          print(f\"{'File':<55} {'Lines':>6} {'Hits':>6} {'Cov%':>6}\")
          print('-' * 75)
          total_lines = total_hits = 0
          for pkg in root.findall('.//package'):
              for cls in pkg.findall('.//class'):
                  fn = cls.get('filename', '?')
                  lines = cls.findall('lines/line')
                  n = len(lines)
                  h = sum(1 for l in lines if int(l.get('hits', 0)) > 0)
                  pct = (h * 100 / n) if n else 0
                  total_lines += n
                  total_hits += h
                  print(f'{fn:<55} {n:>6} {h:>6} {pct:>5.1f}%')
          pct = (total_hits * 100 / total_lines) if total_lines else 0
          print('-' * 75)
          t = 'TOTAL'
          print(f'{t:<55} {total_lines:>6} {total_hits:>6} {pct:>5.1f}%')
          "
      - name: Upload shell coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: shell-scripts
          files: ${{ env.KCOV_OUTPUT_DIR }}/kcov-merged/cobertura.xml
          fail_ci_if_error: false
