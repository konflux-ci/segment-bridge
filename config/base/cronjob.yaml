---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: segment-bridge
  name: segment-bridge
  namespace: segment-bridge
spec:
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - env:
                - name: TEKTON_RESULTS_CA_PATH
                  value: /var/run/segment-bridge/tekton-results-ca/service-ca.crt
              envFrom:
                - secretRef:
                    name: segment-bridge-config
                    optional: true
              image: quay.io/konflux-ci/segment-bridge:latest
              imagePullPolicy: IfNotPresent
              name: segment-bridge
              resources:
                limits:
                  cpu: 200m
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - mountPath: /var/run/segment-bridge/tekton-results-ca
                  name: tekton-results-service-ca
                  readOnly: true
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: segment-bridge
          volumes:
            - name: tmp
              emptyDir: {}
            - configMap:
                items:
                  - key: service-ca.crt
                    path: service-ca.crt
                name: segment-bridge-tekton-results-service-ca
              name: tekton-results-service-ca
  schedule: 0 * * * *
